name: Update data and deploy

on:
  schedule:
    - cron: "23 13 * * *"   # 每天 UTC 13:23（北京时间 21:23）
    - cron: "17 */6 * * *"  # Nebius，每 6 小时
  workflow_dispatch:
    inputs:
      source:
        type: choice
        description: 更新数据源
        default: all
        options: [all, nebius, ramp, gpu-rent]
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  queue: max

jobs:
  update:
    if: github.event.schedule != '17 */6 * * *' && inputs.source != 'nebius' && inputs.source != 'gpu-rent'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decide whether this push needs a Ramp refresh
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]] &&
             ! git diff --quiet "$BEFORE" "$AFTER" -- '*nebius*' &&
             git diff --quiet "$BEFORE" "$AFTER" -- . ':(exclude)*nebius*' ':(exclude)docs/index.html' ':(exclude)docs/yipit.html' ':(exclude)docs/style.css' ':(exclude).github/workflows/update.yml'; then
            echo "nebius_only=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Ramp data and rebuild
        if: steps.scope.outputs.nebius_only != 'true'
        run: python scripts/build.py
      - name: Commit if data changed
        if: steps.scope.outputs.nebius_only != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calibers/ docs/data/tracker*.json docs/data/ramp-*.csv data/dashboard_history.json data/snapshots/
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: Ramp update $(date -u +%Y-%m-%d)"
            git push
          fi

  nebius:
    needs: update
    if: "!cancelled() && github.event.schedule != '23 13 * * *' && inputs.source != 'ramp' && inputs.source != 'gpu-rent'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive Nebius GPU prices
        run: python scripts/build_nebius.py spot
      - name: Verify on-demand rates
        id: rates
        continue-on-error: true
        run: python scripts/build_nebius.py rates
      - name: Report rate update failure
        if: steps.rates.outcome == 'failure'
        run: echo "::warning::牌价更新失败，沿用已存牌价，继续提交现货归档。"
      - name: Run Nebius archive regression tests
        run: python -m unittest discover -s tests -p 'test_build_nebius.py' -v
      - name: Synchronize rental exports with the Nebius daily archive
        run: |
          pip install -r scripts/gpu-rent-requirements.txt
          python scripts/build_gpu_rent.py --export-only
          python -m unittest discover -s tests -p 'test_gpu_rent.py' -v
      - name: Commit Nebius prices and derived rental exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/nebius/raw/ docs/data/nebius.json docs/data/nebius.csv docs/data/nebius-daily.csv
          git add -- data/gpu-rent/ docs/data/gpu-rent.csv docs/data/gpu-rent.json docs/data/gpu-rent-series/
          if ! git diff --cached --quiet; then
            git commit -m "更新 Nebius GPU 小时报价"
            git push origin HEAD:main
          fi

  gpu-rent:
    needs: [update, nebius]
    if: "!cancelled() && (github.event.schedule == '23 13 * * *' || (github.event_name == 'workflow_dispatch' && (inputs.source == 'all' || inputs.source == 'gpu-rent')))"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GPU price page parsers
        run: pip install -r scripts/gpu-rent-requirements.txt
      - name: Archive GPU rental prices and refresh exports
        run: python scripts/build_gpu_rent.py
      - name: Verify price archive and exports
        run: python -m unittest discover -s tests -p 'test_gpu_rent.py' -v
      - name: Commit verified GPU price updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/gpu-rent/ docs/data/gpu-rent.csv docs/data/gpu-rent.json docs/data/gpu-rent-series/
          if ! git diff --cached --quiet; then
            git commit -m "更新 GPU 租赁价格归档"
            git push origin HEAD:main
          fi

  package:
    needs: [update, nebius, gpu-rent]
    if: "!cancelled() && (needs.gpu-rent.result == 'success' || needs.update.result == 'success' || needs.nebius.result == 'success')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        id: pages
      - name: Compare GPU files with the deployed site
        id: gpu_scope
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: bash scripts/gpu_pages_scope.sh
      - uses: actions/setup-python@v5
        if: steps.gpu_scope.outputs.changed == 'true'
        with:
          python-version: "3.12"
      - name: Validate changed GPU files in this Pages checkout
        if: steps.gpu_scope.outputs.changed == 'true'
        run: |
          pip install -r scripts/gpu-rent-requirements.txt
          python -m unittest discover -s tests -p 'test_gpu_rent.py' -v
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: package
    if: "!cancelled() && needs.package.result == 'success'"
    runs-on: ubuntu-latest
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
